<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Half-Adder Input / Output</title>
  <style>
    :root { color-scheme: light; --paper:#f4f1e8; --panel:#fffdf7; --ink:#202820; --muted:#73786d; --line:#d9d7cb; --green:#28634e; --green-dark:#204e3d; --green-soft:#e3eee2; --gold:#edc972; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--paper); color:var(--ink); font:16px/1.5 'Segoe UI', Arial, sans-serif; }
    header { height:56px; display:flex; align-items:center; justify-content:space-between; padding:0 max(22px, calc((100vw - 920px)/2)); background:var(--panel); border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:10px; font-size:12px; font-weight:700; letter-spacing:.1em; }
    .mark { width:26px; height:26px; border-radius:50%; display:grid; place-items:center; background:var(--green); color:white; font:11px 'Courier New', monospace; }
    .tag { color:var(--muted); font:10px 'Courier New', monospace; letter-spacing:.08em; }
    main { width:min(100% - 32px, 760px); margin:18px auto; }
    .eyebrow { color:var(--green); font:11px 'Courier New', monospace; letter-spacing:.12em; text-transform:uppercase; margin:0 0 7px; }
    h1 { font:500 clamp(36px, 6vw, 48px)/1 Georgia, serif; letter-spacing:-.04em; margin:0; }
    .intro { color:#596055; margin:6px 0 12px; font-size:14px; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; box-shadow:0 8px 24px #2028200b; }
    .panel h2 { margin:0 0 10px; font:500 20px Georgia, serif; }
    form { display:grid; grid-template-columns:1fr 1fr auto; gap:10px; align-items:end; }
    label { display:block; color:var(--muted); font:11px 'Courier New', monospace; letter-spacing:.06em; margin:0 0 6px; text-transform:uppercase; }
    select { width:100%; height:40px; appearance:none; border:1px solid #c8cabc; border-radius:5px; padding:0 14px; background:#fff; color:var(--ink); font:16px 'Courier New', monospace; cursor:pointer; }
    select:focus-visible, button:focus-visible { outline:3px solid #9fc3a4; outline-offset:2px; }
    .select-wrap { position:relative; }
    .select-wrap::after { content:'▾'; position:absolute; right:14px; top:6px; pointer-events:none; color:var(--green); }
    .submit { grid-column:auto; min-width:160px; height:40px; padding:0 14px; white-space:nowrap; border:0; border-radius:5px; background:var(--green); color:white; font-weight:600; cursor:pointer; }
    .submit:hover { background:var(--green-dark); }
    .results { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:13px; }
    .result { min-height:76px; border:1px solid var(--line); border-radius:6px; background:#f3f1e8; padding:10px 14px; }
    .result:last-child { background:var(--green-soft); border-color:#cfdecd; }
    .result-label { color:var(--muted); font:10px 'Courier New', monospace; letter-spacing:.1em; }
    .value { display:block; color:var(--green); font:40px/.98 Georgia, serif; margin-top:4px; }
    .status { min-height:18px; color:var(--muted); font-size:12px; margin:8px 0 0; }
    .equations { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
    .equations span { background:#e8e9de; color:#3d5a46; border-radius:4px; padding:7px 9px; font:10px 'Courier New', monospace; }
    @media (max-width:560px) { header { padding:0 16px; } .tag { display:none; } main { margin:26px auto; } .panel { padding:18px; } form { grid-template-columns:1fr 1fr; } .submit { grid-column:1 / -1; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; } }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="mark">01</span><span>LOGIC LAB</span></div>
    <span class="tag">DIGITAL FUNDAMENTALS</span>
  </header>
  <main>
    <p class="eyebrow">Half adder · Input / Output</p>
    <h1>Calculate the output</h1>
    <p class="intro">Choose a 0 or 1 for each input. The half adder returns a Sum bit and a Carry bit.</p>
    <section class="panel" aria-labelledby="input-title">
      <h2 id="input-title">Enter the input bits</h2>
      <form id="halfAdderForm">
        <div>
          <label for="inputA">Input A</label>
          <div class="select-wrap"><select id="inputA" name="inputA"><option value="0" selected>0</option><option value="1">1</option></select></div>
        </div>
        <div>
          <label for="inputB">Input B</label>
          <div class="select-wrap"><select id="inputB" name="inputB"><option value="0" selected>0</option><option value="1">1</option></select></div>
        </div>
        <button class="submit" type="submit">Calculate output</button>
      </form>
      <div class="results" aria-live="polite" aria-label="Half-adder output">
        <div class="result"><span class="result-label">SUM</span><output class="value" id="sumOutput">—</output></div>
        <div class="result"><span class="result-label">CARRY</span><output class="value" id="carryOutput">—</output></div>
      </div>
      <p class="status" id="status">Select both inputs, then calculate.</p>
      <div class="equations"><span>SUM = A XOR B</span><span>CARRY = A AND B</span></div>
    </section>
  </main>
  <script>
    const form = document.getElementById('halfAdderForm');
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const a = Number(document.getElementById('inputA').value);
      const b = Number(document.getElementById('inputB').value);
      const sum = a ^ b;
      const carry = a & b;
      document.getElementById('sumOutput').value = String(sum);
      document.getElementById('sumOutput').textContent = String(sum);
      document.getElementById('carryOutput').value = String(carry);
      document.getElementById('carryOutput').textContent = String(carry);
      document.getElementById('status').textContent = `Input A = ${a}, Input B = ${b}. Output: Sum = ${sum}, Carry = ${carry}.`;
    });
  </script>
</body>
</html>
